name: hass-snapshotter (local build)
version: "0.4.3"
slug: hass_snapshotter
description: Render Home Assistant data to PNG images for e-paper displays, without a browser
arch:
  - aarch64
  - amd64
init: false
# Talks to Core through the Supervisor: no long-lived token needed.
homeassistant_api: true
# Pages are read from Home Assistant's config folder (/homeassistant inside the app).
map:
  - homeassistant_config:ro
ports:
  8080/tcp: 10010
ports_description:
  8080/tcp: Render endpoint for browsers and other hosts. HA itself can use http://<app hostname>:8080
options:
  pages_dir: /homeassistant/dashboard-pages
  render_timeout_ms: 30000
schema:
  pages_dir: str
  render_timeout_ms: int(1000,120000)
  ha_url: url?
  ha_token: password?
