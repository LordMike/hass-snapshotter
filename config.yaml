name: ha-snapshotter
version: "0.2.0"
slug: ha_snapshotter
description: Render Home Assistant data to PNG images for e-paper displays, without a browser
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Pages live in this app's config folder: /addon_configs/<slug>/pages/<name>.js
map:
  - addon_config:rw
ports:
  8080/tcp: 10010
ports_description:
  8080/tcp: Render endpoint (/page/<name>)
options:
  ha_url: "http://homeassistant:8123"
  ha_token: ""
  render_timeout_ms: 30000
schema:
  ha_url: url
  ha_token: password
  render_timeout_ms: int(1000,120000)
